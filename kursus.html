    <style>
        /* ============================================================
           LOGO SHINE
           ============================================================ */
        .logo-shine {
            position: relative;
            display: inline-flex;
            align-items: center;
            overflow: hidden;
            border-radius: 6px;
            padding: 2px 4px;
        }
        .logo-shine::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.75) 50%, transparent 70%);
            animation: shine-sweep 3s infinite;
            z-index: 2;
            pointer-events: none;
        }
        @keyframes shine-sweep {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        .logo-shine img {
            position: relative;
            z-index: 1;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(26, 60, 94, 0.15));
            transition: filter 0.3s ease;
        }
        .logo-shine:hover img {
            filter: drop-shadow(0 4px 8px rgba(26, 60, 94, 0.3));
        }

        /* ============================================================
           MOBILE MENU — HIGHLIGHT
           ============================================================ */
        .mobile-menu-highlight {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1rem;
            margin: 0.35rem 0;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            font-weight: 600;
            background: linear-gradient(135deg, rgba(26,60,94,0.12) 0%, rgba(26,60,94,0.06) 50%, rgba(26,60,94,0.12) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(26, 60, 94, 0.25);
            box-shadow: 0 4px 20px rgba(26, 60, 94, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            color: #1a3c5e !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .mobile-menu-highlight::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.7) 50%, transparent 70%);
            animation: mobile-shine 3.5s infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes mobile-shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        .mobile-menu-highlight > * { position: relative; z-index: 2; }
        .mobile-menu-highlight .menu-icon-wrap {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .mobile-menu-highlight .menu-arrow {
            width: 1rem; height: 1rem;
            opacity: 0.6;
            transition: all 0.3s ease;
        }
        .mobile-menu-highlight:hover,
        .mobile-menu-highlight:active {
            transform: translateX(4px) scale(1.01);
            background: linear-gradient(135deg, rgba(26,60,94,0.18) 0%, rgba(26,60,94,0.1) 50%, rgba(26,60,94,0.18) 100%);
            border-color: rgba(26, 60, 94, 0.4);
            box-shadow: 0 6px 24px rgba(26,60,94,0.15), inset 0 1px 0 rgba(255,255,255,0.6);
        }
        .mobile-menu-highlight:hover .menu-arrow,
        .mobile-menu-highlight:active .menu-arrow {
            opacity: 1;
            transform: translateX(4px);
        }

        /* ============================================================
           PROGRAM GRID — MARKETPLACE
           Mobile: 2 kolom | Tablet: 3 kolom | Desktop: 4 kolom
           ============================================================ */
        .program-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }
        @media (min-width: 640px) {
            .program-grid { grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        }
        @media (min-width: 1024px) {
            .program-grid { grid-template-columns: repeat(4, 1fr); gap: 1.25rem; }
        }

        /* ============================================================
           PROGRAM CARD
           ============================================================ */
        .program-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .program-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(26, 60, 94, 0.12);
        }

        .program-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5;
            background: #f3f4f6;
            overflow: hidden;
        }
        .program-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .program-card:hover .program-image-wrapper img {
            transform: scale(1.05);
        }
/* Link pembungkus gambar — pastikan block & cursor pointer */
.program-image-link {
    display: block;
    cursor: pointer;
}
.program-image-link:hover {
    opacity: 0.97;
}
    .badge-promo {
    position: absolute;
    top: 0.5rem;
    left: 0.5rem;
    background: #bbff00;
    color: rgb(0, 89, 255);
    font-size: 0.6rem;
    font-weight: 800;
    padding: 0.2rem 0.5rem;
    border-radius: 999px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    box-shadow: 0 2px 6px rgba(65, 64, 64, 0.3);
    z-index: 2;

    /* SHINE EFFECT */
    overflow: hidden;
    isolation: isolate;
    animation: badge-pulse 2.5s ease-in-out infinite;
}

/* Kilau bergerak dari kiri ke kanan */
.badge-promo::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        120deg,
        transparent 30%,
        rgba(255, 255, 255, 0.9) 50%,
        transparent 70%
    );
    animation: badge-shine 2.5s ease-in-out infinite;
    z-index: 1;
    pointer-events: none;
}

/* Pastikan teks badge di atas shine */
.badge-promo > * {
    position: relative;
    z-index: 2;
}

@keyframes badge-shine {
    0% {
        left: -100%;
    }
    40%, 100% {
        left: 100%;
    }
}

/* Denyut glow oranye lembut */
@keyframes badge-pulse {
    0%, 100% {
        box-shadow: 0 2px 6px rgba(53, 53, 53, 0.3);
    }
    50% {
        box-shadow: 
            0 2px 6px rgba(41, 41, 41, 0.3),
            0 0 12px rgba(80, 79, 79, 0.5);
    }
}

/* Hormati prefers-reduced-motion */
@media (prefers-reduced-motion: reduce) {
    .badge-promo {
        animation: none;
    }
    .badge-promo::before {
        animation: none;
        display: none;
    }
}

        .badge-kategori {
            position: absolute;

        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f3f4f6 0%, #e5e7eb 50%, #f3f4f6 100%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s ease-in-out infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script type="module">
        import { openWhatsAppGeneric } from './assets/js/whatsapp.js';
        import { loadAllPrograms, filterPrograms, getCategories } from './assets/js/app.js';

        document.addEventListener('DOMContentLoaded', async () => {
            // Load program
            await loadAllPrograms();

            // Init Lucide icons
            if (typeof lucide !== 'undefined') lucide.createIcons();

            // Init filter kategori
            const categories = getCategories();
            const filterSelect = document.getElementById('filterKategori');
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                filterSelect.appendChild(opt);
            });

            // Event search & filter
            document.getElementById('searchInput').addEventListener('input', filterPrograms);
            document.getElementById('filterKategori').addEventListener('change', filterPrograms);

            // Floating WhatsApp
            document.getElementById('floatingWhatsApp').addEventListener('click', (e) => {
                e.preventDefault();
                openWhatsAppGeneric();
            });

            // Mobile menu toggle
            document.getElementById('mobileMenuBtn').addEventListener('click', function() {
                document.getElementById('mobileNav').classList.toggle('hidden');
            });
        });
    </script>
