<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seed Admin | IMDKOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

    <div class="bg-white border border-gray-200 rounded-lg p-8 max-w-md w-full">
        <h1 class="text-xl font-bold text-brand mb-1">Seed Admin</h1>
        <p class="text-sm text-gray-500 mb-6">Buat dokumen <code>users/IV5ga20x3oPqKjk67WEjPEj8Q3O2</code> untuk admin.</p>

        <form id="seedForm">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Admin</label>
                <input type="email" id="email" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand outline-none"
                       placeholder="admin@imdkom.com" />
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand outline-none"
                       placeholder="Password admin" />
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Admin</label>
                <input type="text" id="nama" required value="Admin IMDKOM"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand outline-none" />
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">No. WhatsApp</label>
                <input type="tel" id="whatsapp" required value="0856-0191-3435"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand outline-none" />
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full bg-brand hover:bg-brand-light text-white font-medium py-2 rounded-lg transition-colors">
                Buat Dokumen Admin
            </button>

            <div id="message" class="mt-4 text-sm"></div>
        </form>

        <div class="mt-4 p-3 bg-yellow-50 border border-yellow-200 rounded-lg">
            <p class="text-xs text-yellow-800">
                ⚠️ <strong>Hapus halaman ini setelah selesai.</strong> Siapa pun yang membuka halaman ini bisa membuat dirinya admin.
            </p>
        </div>
    </div>

    <script type="module">
        import { auth, db, signInWithEmailAndPassword, signOut, doc, getDoc, setDoc } from './assets/js/firebase.js';

        // UID admin yang sudah dikonfirmasi
        const ADMIN_UID = 'IV5ga20x3oPqKjk67WEjPEj8Q3O2';

        const form = document.getElementById('seedForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const nama = document.getElementById('nama').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Memproses...';
            messageEl.innerHTML = '';

            try {
                // 1. Login
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                console.log('✅ Login:', user.email, 'UID:', user.uid);

                // 2. Verifikasi UID cocok
                if (user.uid !== ADMIN_UID) {
                    await signOut(auth);
                    messageEl.innerHTML = `
                        <div class="p-3 bg-red-50 border border-red-200 rounded-lg">
                            <p class="text-red-700 font-medium">❌ UID tidak cocok!</p>
                            <p class="text-gray-600 text-xs mt-1">UID login: <code>${user.uid}</code></p>
                            <p class="text-gray-600 text-xs mt-1">UID target: <code>${ADMIN_UID}</code></p>
                            <p class="text-gray-600 text-xs mt-1">Pastikan login dengan akun admin yang benar.</p>
                        </div>
                    `;
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Buat Dokumen Admin';
                    return;
                }

                // 3. Cek apakah dokumen sudah ada
                const docRef = doc(db, 'users', ADMIN_UID);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const existing = docSnap.data();
                    messageEl.innerHTML = `
                        <div class="p-3 bg-yellow-50 border border-yellow-200 rounded-lg">
                            <p class="text-yellow-700 font-medium">⚠️ Dokumen sudah ada!</p>
                            <p class="text-gray-600 text-xs mt-1">Role: <code>${existing.role}</code> • Status: <code>${existing.status}</code></p>
                            <p class="text-gray-600 text-xs mt-1">Tidak perlu dibuat ulang. Coba <a href="login.html" class="text-brand underline">login</a>.</p>
                        </div>
                    `;
                    await signOut(auth);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Buat Dokumen Admin';
                    return;
                }

                // 4. Buat dokumen users/{ADMIN_UID}
                const now = new Date().toISOString();
                await setDoc(docRef, {
                    uid: ADMIN_UID,
                    email: email,
                    nama: nama,
                    whatsapp: whatsapp,
                    role: 'admin',
                    status: 'active',
                    foto: '',
                    bio: '',
                    createdAt: now,
                    updatedAt: now
                });

                messageEl.innerHTML = `
                    <div class="p-3 bg-green-50 border border-green-200 rounded-lg">
                        <p class="text-green-700 font-medium">✅ Berhasil!</p>
                        <p class="text-gray-600 text-xs mt-1">Dokumen <code>users/${ADMIN_UID}</code> sudah dibuat dengan role <code>admin</code>, status <code>active</code>.</p>
                        <p class="text-gray-600 text-xs mt-1 mt-2">Sekarang Anda bisa <a href="login.html" class="text-brand underline font-medium">login</a>.</p>
                    </div>
                `;

                await signOut(auth);

            } catch (error) {
                console.error('Seed error:', error);
                let msg = error.message;
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    msg = 'Email atau password salah.';
                } else if (error.code === 'auth/user-not-found') {
                    msg = 'Email tidak terdaftar.';
                } else if (error.code === 'permission-denied') {
                    msg = 'Firestore Rules menolak akses tulis. Buka rules sementara (lihat instruksi di chat).';
                }
                messageEl.innerHTML = `<p class="text-red-600">❌ Gagal: ${msg}</p>`;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Buat Dokumen Admin';
            }
        });
    </script>

</body>
</html>
