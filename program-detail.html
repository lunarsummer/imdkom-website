<style>
    /* ============================================================
       LOGO SHINE EFFECT (Shine Sweep)
       ============================================================ */
    .logo-shine {
        position: relative;
        display: inline-flex;
        align-items: center;
        overflow: hidden;
        border-radius: 6px;
        padding: 2px 4px;
    }
    
    .logo-shine::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            120deg,
            transparent 30%,
            rgba(255, 255, 255, 0.75) 50%,
            transparent 70%
        );
        animation: shine-sweep 3s infinite;
        z-index: 2;
        pointer-events: none;
    }
    
    @keyframes shine-sweep {
        0% {
            left: -100%;
        }
        50%, 100% {
            left: 100%;
        }
    }
    
    .logo-shine img {
        position: relative;
        z-index: 1;
        display: block;
        filter: drop-shadow(0 2px 4px rgba(26, 60, 94, 0.15));
        transition: filter 0.3s ease;
    }
    
    .logo-shine:hover img {
        filter: drop-shadow(0 4px 8px rgba(26, 60, 94, 0.3));
    }
</style>
