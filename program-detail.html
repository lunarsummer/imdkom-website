<!DOCTYPE html>
<html lang="id">
<head>

    <title>Detail Program | IMDKOM</title>
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#1a3c5e', light: '#2a5a7a', dark: '#0f2a42' },
                    }
                }
            }
        }
    </script>
</head>
<body>

    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200 py-3">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <span class="text-2xl font-bold text-brand">IMDKOM</span>
                <span class="text-sm text-gray-500 hidden sm:inline">Kursus &amp; Pelatihan • Computer Service</span>
            </a>
            <div class="flex items-center gap-6">
                <a href="index.html" class="text-gray-600 hover:text-brand">Beranda</a>
                <a href="kursus.html" class="text-gray-600 hover:text-brand">Kursus &amp; Pelatihan</a>
                <a href="service.html" class="text-gray-600 hover:text-brand">Computer Service</a>
                <a href="tentang.html" class="text-gray-600 hover:text-brand">Tentang</a>
                <a href="kontak.html" class="text-gray-600 hover:text-brand">Kontak</a>
                <a href="admin/login.html" class="text-xs text-gray-400 hover:text-gray-600">Login</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <section class="py-12 md:py-16">
        <div class="container mx-auto px-4">
            <div id="programDetailContainer">
                <div class="text-center text-gray-500 py-10">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-brand border-t-transparent"></div>
                    <p class="mt-3">Memuat detail program...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-8 border-t border-gray-200 bg-gray-50">
        <div class="container mx-auto px-4 text-center text-sm text-gray-500">
            <p>&copy; 2026 IMDKOM. All rights reserved.</p>
            <a href="admin/login.html" class="text-xs text-gray-300 hover:text-gray-500 transition-colors">Login</a>
        </div>
    </footer>

    <!-- Floating WhatsApp -->
    <a href="#" id="floatingWhatsApp" class="fixed bottom-6 right-6 bg-[#25d366] text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg z-50 hover:scale-105 transition-transform">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">

    </a>

    <script type="module">
        import { openWhatsAppGeneric } from './assets/js/whatsapp.js';
        import { loadProgramDetail } from './assets/js/app.js';

        document.addEventListener('DOMContentLoaded', () => {
            loadProgramDetail();
            
            document.getElementById('floatingWhatsApp').addEventListener('click', (e) => {
                e.preventDefault();
                openWhatsAppGeneric();
            });
        });
    </script>

</body>
</html>
