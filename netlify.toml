# ============================================================
# NETLIFY CONFIGURATION
# IMDKOM Yogyakarta
# ============================================================

[build]
  publish = "."

# ============================================================
# REDIRECT — Kalau akses /program-detail tanpa .html
# ============================================================
[[redirects]]
  from = "/program-detail"
  to = "/program-detail.html"
  status = 200
  force = true

# ============================================================
# HEADERS — Cache & security
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"