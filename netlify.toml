[build]
  publish = "."

# Gunakan path tanpa .html agar fungsi ini menangkap request sebelum file statis
[[edge_functions]]
  path = "/program-detail"
  function = "program-detail-og"

# Redirect ini akan memastikan URL dengan .html juga diarahkan ke fungsi
[[redirects]]
  from = "/program-detail.html"
  to = "/program-detail"
  status = 200
  force = true