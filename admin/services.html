<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer Service | Admin IMDKOM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

    <div class="admin-mobile-header">
        <button class="hamburger" id="menuToggle"><i data-lucide="menu" class="w-6 h-6"></i></button>
        <span class="text-white font-bold">Computer Service</span>
        <div class="w-8"></div>
    </div>

    <div class="admin-overlay" id="overlay"></div>

    <aside class="admin-sidebar" id="sidebar">
        <div class="brand">IMDKOM Admin</div>
        <nav>
            <a href="dashboard.html" class="nav-link"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Dashboard</a>
            <a href="landing-page.html" class="nav-link"><i data-lucide="home" class="w-4 h-4"></i>Landing Page</a>
            <a href="programs.html" class="nav-link"><i data-lucide="book-open" class="w-4 h-4"></i>Program Kursus</a>
            <a href="services.html" class="nav-link active"><i data-lucide="wrench" class="w-4 h-4"></i>Computer Service</a>
            <a href="pricelists.html" class="nav-link"><i data-lucide="tag" class="w-4 h-4"></i>Pricelist</a>
            <a href="documentations.html" class="nav-link"><i data-lucide="image" class="w-4 h-4"></i>Dokumentasi</a>
            <a href="testimonials.html" class="nav-link"><i data-lucide="message-square" class="w-4 h-4"></i>Testimoni</a>
            <a href="faq.html" class="nav-link"><i data-lucide="help-circle" class="w-4 h-4"></i>FAQ</a>
            <a href="consultations.html" class="nav-link"><i data-lucide="inbox" class="w-4 h-4"></i>Konsultasi</a>
            <a href="settings.html" class="nav-link"><i data-lucide="settings" class="w-4 h-4"></i>Pengaturan</a>
            <button id="logoutBtn" class="logout-btn"><i data-lucide="log-out" class="w-4 h-4"></i>Logout</button>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="page-header">
            <h2>Computer Service</h2>
            <a href="service-form.html" class="btn-primary">
                <i data-lucide="plus" class="w-4 h-4"></i>
                Tambah Layanan
            </a>
        </div>

        <div class="admin-card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Urutan</th>
                            <th>Icon</th>
                            <th>Nama</th>
                            <th>Slug</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="servicesList">
                        <tr>
                            <td colspan="6" class="text-center text-gray-500 py-8">
                                <div class="inline-block animate-spin rounded-full h-6 w-6 border-4 border-brand border-t-transparent"></div>
                                <p class="mt-2">Memuat...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, onAuthStateChanged, signOut, db, collection, getDocs, query, orderBy, deleteDoc, doc } from '../assets/js/firebase.js';

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        document.getElementById('menuToggle').addEventListener('click', () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        });

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            else {
                loadServices();
                lucide.createIcons();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });

        async function loadServices() {
            const container = document.getElementById('servicesList');
            try {
                const q = query(collection(db, 'services'), orderBy('order', 'asc'));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    container.innerHTML = `<tr><td colspan="6" class="text-center text-gray-500 py-8">Belum ada layanan. <a href="service-form.html" class="text-brand hover:underline">Tambah</a></td></tr>`;
                    return;
                }

                let html = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    html += `
                        <tr>
                            <td data-label="Urutan">${data.order || '-'}</td>
                            <td data-label="Icon">
                                <div class="w-10 h-10 bg-brand/10 rounded-lg flex items-center justify-center text-brand">
                                    <i data-lucide="${data.icon || 'wrench'}" class="w-5 h-5"></i>
                                </div>
                            </td>
                            <td data-label="Nama"><span class="font-medium text-gray-800">${data.nama || '-'}</span></td>
                            <td data-label="Slug"><code class="text-xs bg-gray-100 px-2 py-1 rounded">${data.slug || '-'}</code></td>
                            <td data-label="Status">
                                <span class="badge ${data.aktif ? 'badge-success' : 'badge-gray'}">${data.aktif ? 'Aktif' : 'Nonaktif'}</span>
                            </td>
                            <td data-label="Aksi">
                                <div class="flex gap-2">
                                    <a href="service-form.html?id=${docSnap.id}" class="text-brand hover:text-brand-light text-sm font-medium">Edit</a>
                                    <button class="delete-btn text-red-600 hover:text-red-800 text-sm font-medium" data-id="${docSnap.id}" data-name="${data.nama || ''}">Hapus</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                container.innerHTML = html;
                lucide.createIcons();

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (confirm(`Hapus layanan "${btn.dataset.name}"?`)) {
                            await deleteDoc(doc(db, 'services', btn.dataset.id));
                            loadServices();
                        }
                    });
                });
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<tr><td colspan="6" class="text-center text-red-600 py-8">Gagal memuat. <br><small>${error.message}</small></td></tr>`;
            }
        }
    </script>

</body>
</html>
