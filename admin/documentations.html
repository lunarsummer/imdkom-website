<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dokumentasi | Admin IMDKOM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/admin.css">
    <style>/* NAV GROUP / SUBMENU */
.nav-group { margin: 0; }

.nav-group-toggle {
    display: flex;
    align-items: center;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    cursor: pointer;
    font: inherit;
    color: inherit;
}

.nav-group-toggle .nav-chevron {
    transition: transform 0.25s ease;
    opacity: 0.6;
}

.nav-group-toggle.open .nav-chevron {
    transform: rotate(180deg);
    opacity: 1;
}

.nav-group-toggle.open {
    background: rgba(255, 255, 255, 0.08);
}

.nav-submenu {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    padding: 0.25rem 0 0.5rem 0;
    margin-left: 0.5rem;
    border-left: 2px solid rgba(255, 255, 255, 0.1);
    animation: submenuSlide 0.25s ease;
}

.nav-submenu.hidden { display: none; }

@keyframes submenuSlide {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
}

.nav-submenu-link {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.8rem;
    color: #d1d5db;
    text-decoration: none;
    border-radius: 0.375rem;
    transition: all 0.2s ease;
    margin-left: 0.25rem;
}

.nav-submenu-link:hover {
    background: rgba(255, 255, 255, 0.08);
    color: white;
}

.nav-submenu-link.active {
    background: rgba(255, 255, 255, 0.15);
    color: white;
    font-weight: 600;
}

.nav-submenu-link i { opacity: 0.7; flex-shrink: 0; }
.nav-submenu-link.active i { opacity: 1; }</style>
</head>
<body>

    <!-- MOBILE HEADER -->
    <div class="admin-mobile-header">
        <button class="hamburger" id="menuToggle"><i data-lucide="menu" class="w-6 h-6"></i></button>
        <span class="text-white font-bold">Dokumentasi</span>
        <div class="w-8"></div>
    </div>

    <div class="admin-overlay" id="overlay"></div>

    <!-- ============================================================
    SIDEBAR ADMIN
    ============================================================ -->
<aside class="admin-sidebar" id="sidebar">
    <div class="brand">IMDKOM Admin</div>
    <nav>
        <a href="dashboard.html" class="nav-link">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            Dashboard
        </a>
        <a href="landing-page.html" class="nav-link">
            <i data-lucide="home" class="w-4 h-4"></i>
            Landing Page
        </a>

        <!-- Program Kursus — dengan submenu -->
        <div class="nav-group">
            <button type="button" 
                    class="nav-link nav-group-toggle w-full justify-between" 
                    data-target="submenu-program">
                <span class="flex items-center gap-2">
                    <i data-lucide="book-open" class="w-4 h-4"></i>
                    Program Kursus
                </span>
                <i data-lucide="chevron-down" class="w-4 h-4 transition-transform nav-chevron"></i>
            </button>

            <div id="submenu-program" class="nav-submenu hidden">
                <a href="programs.html" class="nav-submenu-link">
                    <i data-lucide="list" class="w-3.5 h-3.5"></i>
                    Daftar Program
                </a>
                <a href="program-submissions.html" class="nav-submenu-link">
                    <i data-lucide="file-check" class="w-3.5 h-3.5"></i>
                    Review Usulan
                </a>
                <a href="tentors.html" class="nav-submenu-link">
                    <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i>
                    Tentor
                </a>
            </div>
        </div>

        <a href="services.html" class="nav-link">
            <i data-lucide="wrench" class="w-4 h-4"></i>
            Computer Service
        </a>
        <a href="pc-components.html" class="nav-link">
            <i data-lucide="cpu" class="w-4 h-4"></i>
            PC Components
        </a>
        <a href="pricelists.html" class="nav-link">
            <i data-lucide="tag" class="w-4 h-4"></i>
            Pricelist
        </a>
        <a href="documentations.html" class="nav-link active">
            <i data-lucide="image" class="w-4 h-4"></i>
            Dokumentasi
        </a>
        <a href="testimonials.html" class="nav-link">
            <i data-lucide="message-square" class="w-4 h-4"></i>
            Testimoni
        </a>
        <a href="faq.html" class="nav-link">
            <i data-lucide="help-circle" class="w-4 h-4"></i>
            FAQ
        </a>
        <a href="consultations.html" class="nav-link">
            <i data-lucide="inbox" class="w-4 h-4"></i>
            Konsultasi
        </a>
        <a href="settings.html" class="nav-link">
            <i data-lucide="settings" class="w-4 h-4"></i>
            Pengaturan
        </a>
        <button id="logoutBtn" class="logout-btn">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            Logout
        </button>
    </nav>
</aside>

    <!-- MAIN -->
    <main class="admin-main">
        <div class="page-header">
            <h2>Dokumentasi</h2>
            <a href="documentation-form.html" class="btn-primary">
                <i data-lucide="plus" class="w-4 h-4"></i>
                Tambah Dokumentasi
            </a>
        </div>

        <!-- Filter -->
        <div class="admin-card mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Filter Layanan</label>
            <select id="filterService" class="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none text-sm">
                <option value="">Semua Layanan</option>
                <option value="laptop">Service Laptop</option>
                <option value="pc">Service PC</option>
                <option value="printer">Service Printer</option>
                <option value="panggil">Service Panggil</option>
                <option value="sparepart">Sparepart</option>
            </select>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4" id="docsGrid">
            <div class="col-span-full text-center text-gray-500 py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-brand border-t-transparent"></div>
                <p class="mt-3 text-sm">Memuat...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, onAuthStateChanged, signOut, db, collection, getDocs, query, orderBy, where, deleteDoc, doc } from '../assets/js/firebase.js';
        import { PLACEHOLDER_IMAGE } from '../assets/js/placeholder.js';
        import { optimizeCloudinaryUrl } from '../assets/js/cloudinary.js';

        // ============================================================
        // MOBILE SIDEBAR
        // ============================================================
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        document.getElementById('menuToggle').addEventListener('click', () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        });

        // ============================================================
        // AUTH
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            else {
                loadDocs();
                lucide.createIcons();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });

        document.getElementById('filterService').addEventListener('change', loadDocs);

        // ============================================================
        // LOAD DOCS
        // ============================================================
        async function loadDocs() {
            const container = document.getElementById('docsGrid');
            const serviceFilter = document.getElementById('filterService').value;

            try {
                let q = query(collection(db, 'documentations'), orderBy('serviceSlug', 'asc'), orderBy('order', 'asc'));

                if (serviceFilter) {
                    q = query(
                        collection(db, 'documentations'),
                        where('serviceSlug', '==', serviceFilter),
                        orderBy('order', 'asc')
                    );
                }

                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="col-span-full admin-card text-center text-gray-500 py-12">
                            <i data-lucide="image" class="w-12 h-12 mx-auto text-gray-300 mb-3"></i>
                            <p>Belum ada dokumentasi.</p>
                            <a href="documentation-form.html" class="btn-primary mt-4 inline-flex">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                                Tambah Dokumentasi
                            </a>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                const serviceNames = { laptop: 'Laptop', pc: 'PC', printer: 'Printer', panggil: 'Panggil', sparepart: 'Sparepart' };

                let html = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    
                    // Support format baru (gambarList array) & lama (gambar string)
                    let coverUrl = PLACEHOLDER_IMAGE;
                    let totalFoto = 0;
                    
                    if (data.gambarList && Array.isArray(data.gambarList) && data.gambarList.length > 0) {
                        coverUrl = optimizeCloudinaryUrl(data.gambarList[0], { width: 400, height: 400, crop: 'fill' });
                        totalFoto = data.gambarList.length;
                    } else if (data.gambar) {
                        coverUrl = optimizeCloudinaryUrl(data.gambar, { width: 400, height: 400, crop: 'fill' });
                        totalFoto = 1;
                    }
                    
                    const serviceName = serviceNames[data.serviceSlug] || data.serviceSlug || '-';

                    html += `
                        <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden group hover:shadow-md transition-shadow">
                            <div class="relative aspect-square bg-gray-100">
                                <img src="${coverUrl}" alt="${data.nama || ''}" 
                                     class="w-full h-full object-cover" 
                                     loading="lazy"
                                     data-fallback="${PLACEHOLDER_IMAGE}"
                                     onerror="this.onerror=null; this.src=this.dataset.fallback;" />
                                
                                <!-- Badge Layanan -->
                                <span class="absolute top-2 left-2 bg-brand text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${serviceName}</span>
                                
                                <!-- Badge Jumlah Foto (jika > 1) -->
                                ${totalFoto > 1 ? `
                                    <span class="absolute bottom-2 right-2 bg-black/70 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-1 rounded-full flex items-center gap-1">
                                        <i data-lucide="image" class="w-3 h-3"></i>
                                        ${totalFoto}
                                    </span>
                                ` : ''}
                                
                                <!-- Badge Status Aktif -->
                                <span class="absolute top-2 right-2 text-[10px] font-bold px-2 py-0.5 rounded-full ${data.aktif ? 'bg-green-500 text-white' : 'bg-gray-500 text-white'}">
                                    ${data.aktif ? 'AKTIF' : 'OFF'}
                                </span>
                            </div>
                            <div class="p-3">
                                <h3 class="font-semibold text-gray-800 text-sm truncate">${data.nama || '-'}</h3>
                                <p class="text-xs text-gray-500 mt-1 truncate">${data.keterangan || '-'}</p>
                                <div class="flex gap-2 mt-3">
                                    <a href="documentation-form.html?id=${docSnap.id}" class="flex-1 text-center bg-brand hover:bg-brand-light text-white text-xs font-medium py-1.5 rounded-lg transition-colors">Edit</a>
                                    <button class="delete-btn flex-1 bg-red-600 hover:bg-red-700 text-white text-xs font-medium py-1.5 rounded-lg transition-colors" data-id="${docSnap.id}" data-name="${data.nama || ''}">Hapus</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                lucide.createIcons();

                // Delete handler
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (confirm(`Hapus dokumentasi "${btn.dataset.name}"?\n\nSemua foto di dalamnya akan dihapus dari tampilan.`)) {
                            try {
                                btn.disabled = true;
                                btn.innerHTML = `<i data-lucide="loader" class="w-3 h-3 animate-spin"></i>`;
                                lucide.createIcons();
                                
                                await deleteDoc(doc(db, 'documentations', btn.dataset.id));
                                loadDocs();
                            } catch (error) {
                                console.error('Error deleting:', error);
                                alert('Gagal menghapus: ' + error.message);
                                btn.disabled = false;
                            }
                        }
                    });
                });

            } catch (error) {
                console.error('Error loading docs:', error);
                container.innerHTML = `
                    <div class="col-span-full text-center text-red-600 py-12">
                        Gagal memuat dokumentasi.
                        <br>
                        <small class="text-gray-500">${error.message}</small>
                    </div>
                `;
            }
        }
        // ============================================================
// NAV SUBMENU — TOGGLE
// ============================================================
document.querySelectorAll('.nav-group-toggle').forEach(toggle => {
    toggle.addEventListener('click', () => {
        const targetId = toggle.dataset.target;
        const submenu = document.getElementById(targetId);
        if (!submenu) return;

        const isOpen = !submenu.classList.contains('hidden');

        if (isOpen) {
            submenu.classList.add('hidden');
            toggle.classList.remove('open');
        } else {
            submenu.classList.remove('hidden');
            toggle.classList.add('open');
        }

        if (typeof lucide !== 'undefined') lucide.createIcons();
    });
});

// Auto-buka submenu kalau ada link active di dalamnya
document.querySelectorAll('.nav-submenu-link.active').forEach(activeLink => {
    const submenu = activeLink.closest('.nav-submenu');
    if (submenu) {
        submenu.classList.remove('hidden');
        const toggle = document.querySelector(`.nav-group-toggle[data-target="${submenu.id}"]`);
        if (toggle) toggle.classList.add('open');
    }
});
    </script>

</body>
</html>
