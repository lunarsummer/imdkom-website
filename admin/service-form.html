<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Layanan | Admin IMDKOM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./assets/css/admin.css">
    
    <style>
        .preview-img {
            max-height: 200px;
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: #f8fafc;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="admin-mobile-header">
        <button class="hamburger" id="menuToggle"><i data-lucide="menu" class="w-6 h-6"></i></button>
        <span class="text-white font-bold">Form Layanan</span>
        <div class="w-8"></div>
    </div>

    <div class="admin-overlay" id="overlay"></div>

    <aside class="admin-sidebar" id="sidebar">
        <div class="brand">IMDKOM Admin</div>
        <nav>
            <a href="dashboard.html" class="nav-link"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Dashboard</a>
            <a href="landing-page.html" class="nav-link"><i data-lucide="home" class="w-4 h-4"></i>Landing Page</a>
            <a href="programs.html" class="nav-link"><i data-lucide="book-open" class="w-4 h-4"></i>Program Kursus</a>
            <a href="services.html" class="nav-link active"><i data-lucide="wrench" class="w-4 h-4"></i>Computer Service</a>
            <a href="pricelists.html" class="nav-link"><i data-lucide="tag" class="w-4 h-4"></i>Pricelist</a>
            <a href="documentations.html" class="nav-link"><i data-lucide="image" class="w-4 h-4"></i>Dokumentasi</a>
            <a href="testimonials.html" class="nav-link"><i data-lucide="message-square" class="w-4 h-4"></i>Testimoni</a>
            <a href="faq.html" class="nav-link"><i data-lucide="help-circle" class="w-4 h-4"></i>FAQ</a>
            <a href="consultations.html" class="nav-link"><i data-lucide="inbox" class="w-4 h-4"></i>Konsultasi</a>
            <a href="settings.html" class="nav-link"><i data-lucide="settings" class="w-4 h-4"></i>Pengaturan</a>
            <button id="logoutBtn" class="logout-btn"><i data-lucide="log-out" class="w-4 h-4"></i>Logout</button>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="page-header">
            <h2 id="formTitle">Tambah Layanan</h2>
            <a href="services.html" class="text-gray-500 hover:text-gray-700 text-sm flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>Kembali
            </a>
        </div>

        <div class="admin-card max-w-3xl">
            <form id="serviceForm">
                <input type="hidden" id="serviceId" />

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Layanan *</label>
                        <input type="text" id="nama" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none text-sm" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Slug *</label>
                        <input type="text" id="slug" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none text-sm" placeholder="laptop, pc, printer" />
                        <p class="text-xs text-gray-500 mt-1">Digunakan untuk URL: service-laptop</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                        <input type="text" id="kategori" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none text-sm" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Icon (Lucide)</label>
                        <input type="text" id="icon" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none text-sm" placeholder="laptop, monitor, printer" />
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
                    <textarea id="deskripsi" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none text-sm"></textarea>
                </div>

                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi Singkat</label>
                    <input type="text" id="deskripsiSingkat" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none text-sm" />
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Harga Mulai</label>
                        <input type="text" id="hargaMulai" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none text-sm" placeholder="Rp 100.000" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Urutan</label>
                        <input type="number" id="order" value="1" min="1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none text-sm" />
                    </div>
                </div>

                <!-- ============================================================ -->
                <!-- GAMBAR LAYANAN (Cloudinary) -->
                <!-- ============================================================ -->
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gambar Layanan</label>

                    <div id="gambarPreviewWrapper" class="hidden mb-3">
                        <img id="gambarPreview" src="" alt="Preview" class="preview-img" />
                    </div>

                    <div class="flex flex-wrap gap-2 mb-3">
                        <!-- Tombol Upload (Hijau) -->
                        <button type="button" 
                                id="uploadGambarBtn" 
                                class="inline-flex items-center gap-2 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold shadow-md shadow-emerald-200 transition-all hover:-translate-y-0.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                            </svg>
                            <span id="uploadGambarText">Upload Gambar</span>
                        </button>

                        <!-- Tombol Gunakan Link (Biru) -->
                        <button type="button" 
                                id="linkGambarBtn" 
                                class="inline-flex items-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-md shadow-blue-200 transition-all hover:-translate-y-0.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                            </svg>
                            Gunakan Link
                        </button>

                        <!-- Tombol Hapus (Merah) -->
                        <button type="button" 
                                id="removeGambarBtn" 
                                class="hidden inline-flex items-center gap-2 px-5 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-sm font-semibold border border-red-200 transition-all hover:-translate-y-0.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            Hapus
                        </button>
                    </div>

                    <!-- Input Link URL (Muncul saat tombol Biru diklik) -->
                    <div id="linkInputWrapper" class="hidden mb-3 p-3 bg-blue-50 border border-blue-200 rounded-xl">
                        <div class="flex gap-2">
                            <input type="url" 
                                   id="gambarLinkInput" 
                                   class="flex-1 px-4 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" 
                                   placeholder="https://example.com/gambar.jpg" />
                            <button type="button" 
                                    id="applyLinkBtn" 
                                    class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow-md transition-all">
                                Terapkan
                            </button>
                        </div>
                    </div>

                    <input type="hidden" id="gambar" />
                    <p class="text-xs text-gray-400 mt-1">Upload ke Cloudinary (otomatis dioptimasi) atau gunakan Link URL eksternal.</p>
                </div>

                <div class="mt-4 flex items-center gap-3">
                    <input type="checkbox" id="aktif" checked class="w-4 h-4 text-brand focus:ring-brand border-gray-300 rounded" />
                    <label for="aktif" class="text-sm text-gray-700">Aktif</label>
                </div>

                <div class="flex flex-wrap gap-3 mt-6 pt-4 border-t border-gray-200">
                    <button type="submit" class="btn-primary"><i data-lucide="save" class="w-4 h-4"></i>Simpan</button>
                    <a href="services.html" class="btn-secondary">Batal</a>
                </div>

                <div id="formMessage" class="mt-3"></div>
            </form>
        </div>
    </main>

    <script type="module">
        import { auth, onAuthStateChanged, signOut, db, doc, getDoc, addDoc, updateDoc, collection } from './assets/js/firebase.js';
        import { setupImageUploadField, setExistingImagePreview } from './assets/js/cloudinary.js';

        // ============================================================
        // KONFIGURASI FIELD GAMBAR
        // ============================================================
        const GAMBAR_FIELD_CONFIG = {
            uploadBtnId: 'uploadGambarBtn',
            uploadTextId: 'uploadGambarText',
            removeBtnId: 'removeGambarBtn',
            inputId: 'gambar',
            previewWrapperId: 'gambarPreviewWrapper',
            previewImgId: 'gambarPreview',
            folder: 'services',
            previewWidth: 400
        };

        // ============================================================
        // MOBILE SIDEBAR
        // ============================================================
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        document.getElementById('menuToggle').addEventListener('click', () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        });

        // ============================================================
        // AUTH
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'index.html';
            else {
                checkEditMode();
                lucide.createIcons();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'index.html';
        });

        // ============================================================
        // INIT CLOUDINARY UPLOAD + LINK INPUT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            setupImageUploadField(GAMBAR_FIELD_CONFIG);
            initLinkInput();
        });

        function initLinkInput() {
            const linkBtn = document.getElementById('linkGambarBtn');
            const linkInputWrapper = document.getElementById('linkInputWrapper');
            const applyLinkBtn = document.getElementById('applyLinkBtn');
            const gambarLinkInput = document.getElementById('gambarLinkInput');
            const gambarHiddenInput = document.getElementById('gambar');
            const previewWrapper = document.getElementById('gambarPreviewWrapper');
            const previewImg = document.getElementById('gambarPreview');
            const removeBtn = document.getElementById('removeGambarBtn');
            const uploadText = document.getElementById('uploadGambarText');

            if (!linkBtn) return;

            // Toggle form input link
            linkBtn.addEventListener('click', () => {
                linkInputWrapper.classList.toggle('hidden');
                if (!linkInputWrapper.classList.contains('hidden')) {
                    gambarLinkInput.focus();
                }
            });

            // Terapkan URL Link ke Preview
            applyLinkBtn.addEventListener('click', () => {
                const url = gambarLinkInput.value.trim();
                if (!url) {
                    alert('Mohon masukkan URL gambar.');
                    return;
                }
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    alert('URL harus diawali dengan http:// atau https://');
                    return;
                }

                // Set value ke input hidden
                gambarHiddenInput.value = url;

                // Tampilkan Preview
                previewImg.src = url;
                previewImg.onerror = function() {
                    alert('Gambar tidak dapat dimuat. Pastikan URL valid.');
                    this.onerror = null;
                };
                previewWrapper.classList.remove('hidden');
                removeBtn.classList.remove('hidden');
                uploadText.textContent = 'Ganti Gambar';

                // Sembunyikan input link
                linkInputWrapper.classList.add('hidden');
                gambarLinkInput.value = '';
            });
        }

        // ============================================================
        // CHECK EDIT MODE
        // ============================================================
        async function checkEditMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                document.getElementById('formTitle').textContent = 'Edit Layanan';
                document.getElementById('serviceId').value = id;
                await loadService(id);
            }
        }

        async function loadService(id) {
            try {
                const docSnap = await getDoc(doc(db, 'services', id));
                if (!docSnap.exists()) {
                    alert('Layanan tidak ditemukan');
                    window.location.href = 'services.html';
                    return;
                }
                const data = docSnap.data();
                document.getElementById('nama').value = data.nama || '';
                document.getElementById('slug').value = data.slug || '';
                document.getElementById('kategori').value = data.kategori || '';
                document.getElementById('icon').value = data.icon || '';
                document.getElementById('deskripsi').value = data.deskripsi || '';
                document.getElementById('deskripsiSingkat').value = data.deskripsiSingkat || '';
                document.getElementById('hargaMulai').value = data.hargaMulai || '';
                document.getElementById('order').value = data.order || 1;
                document.getElementById('aktif').checked = data.aktif !== false;

                // Set gambar & preview
                document.getElementById('gambar').value = data.gambar || '';
                if (data.gambar) {
                    setExistingImagePreview(GAMBAR_FIELD_CONFIG, data.gambar);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // ============================================================
        // SUBMIT
        // ============================================================
        document.getElementById('serviceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('serviceId').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            const messageEl = document.getElementById('formMessage');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Menyimpan...';
            messageEl.innerHTML = '';

            const data = {
                nama: document.getElementById('nama').value.trim(),
                slug: document.getElementById('slug').value.trim().toLowerCase(),
                kategori: document.getElementById('kategori').value.trim(),
                icon: document.getElementById('icon').value.trim() || 'wrench',
                deskripsi: document.getElementById('deskripsi').value.trim(),
                deskripsiSingkat: document.getElementById('deskripsiSingkat').value.trim(),
                hargaMulai: document.getElementById('hargaMulai').value.trim(),
                gambar: document.getElementById('gambar').value.trim(),
                order: parseInt(document.getElementById('order').value) || 1,
                aktif: document.getElementById('aktif').checked,
                updatedAt: new Date().toISOString()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, 'services', id), data);
                    messageEl.innerHTML = `<p class="text-green-600 text-sm">✅ Berhasil diupdate!</p>`;
                } else {
                    data.createdAt = new Date().toISOString();
                    await addDoc(collection(db, 'services'), data);
                    messageEl.innerHTML = `<p class="text-green-600 text-sm">✅ Berhasil ditambahkan!</p>`;
                    this.reset();
                    document.getElementById('gambarPreviewWrapper').classList.add('hidden');
                    document.getElementById('removeGambarBtn').classList.add('hidden');
                    document.getElementById('uploadGambarText').textContent = 'Upload Gambar';
                }
                setTimeout(() => window.location.href = 'services.html', 1500);
            } catch (error) {
                console.error('Error:', error);
                messageEl.innerHTML = `<p class="text-red-600 text-sm">❌ Gagal: ${error.message}</p>`;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Simpan';
            }
        });
    </script>

</body>
</html>
