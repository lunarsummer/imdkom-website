<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Layanan | Admin IMDKOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#1a3c5e', light: '#2a5a7a', dark: '#0f2a42' },
                    }
                }
            }
        }
    </script>
    <style>
        .form-preview-img { max-height: 200px; border-radius: 4px; border: 1px solid #e5e7eb; }
    </style>
</head>
<body>

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-brand min-h-screen hidden md:block">
            <div class="p-6 border-b border-brand-light">
                <span class="text-white font-bold text-xl">IMDKOM Admin</span>
            </div>
            <nav class="p-4 space-y-1">
                <a href="dashboard.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">Dashboard</a>
                <a href="landing-page.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">Landing Page</a>
                <a href="programs.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">Program Kursus</a>
                <a href="services.html" class="block px-4 py-2 text-white bg-brand-light rounded-lg">Computer Service</a>
                <a href="testimonials.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">Testimoni</a>
                <a href="faq.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">FAQ</a>
                <a href="settings.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">Pengaturan</a>
                <button id="logoutBtn" class="block w-full text-left px-4 py-2 text-gray-400 hover:text-white hover:bg-brand-light rounded-lg transition-colors mt-4">Logout</button>
            </nav>
        </aside>

        <!-- Mobile -->
        <div class="md:hidden w-full bg-brand p-4 flex justify-between items-center">
            <span class="text-white font-bold">IMDKOM Admin</span>
            <button id="mobileLogout" class="text-gray-300 hover:text-white text-sm">Logout</button>
        </div>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
                <h2 class="text-2xl md:text-3xl font-bold text-brand" id="formTitle">Tambah Layanan</h2>
                <a href="services.html" class="text-gray-500 hover:text-gray-700 transition-colors">← Kembali</a>
            </div>

            <div class="bg-white border border-gray-200 rounded-lg p-6">
                <form id="serviceForm">
                    <input type="hidden" id="serviceId" />
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Layanan *</label>
                            <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                                   id="nama" required />
                        </div>
                        <div>
                            <label for="kategori" class="block text-sm font-medium text-gray-700 mb-1">Kategori *</label>
                            <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                                    id="kategori" required>
                                <option value="">Pilih kategori</option>
                                <option value="Service Laptop">Service Laptop</option>
                                <option value="Service PC">Service PC</option>
                                <option value="Service Printer">Service Printer</option>
                                <option value="Sparepart">Sparepart</option>
                                <option value="Upgrade">Upgrade</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label for="deskripsi" class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
                        <textarea class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                                  id="deskripsi" rows="3"></textarea>
                    </div>

                    <div class="mt-4">
                        <label for="deskripsiSingkat" class="block text-sm font-medium text-gray-700 mb-1">Deskripsi Singkat</label>
                        <textarea class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                                  id="deskripsiSingkat" rows="2"></textarea>
                        <p class="text-xs text-gray-400 mt-1">Maksimal 100 karakter untuk tampilan di halaman utama.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div>
                            <label for="hargaMulai" class="block text-sm font-medium text-gray-700 mb-1">Harga Mulai</label>
                            <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                                   id="hargaMulai" placeholder="Rp 100.000" />
                        </div>
                        <div>
                            <label for="order" class="block text-sm font-medium text-gray-700 mb-1">Urutan Tampil</label>
                            <input type="number" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                                   id="order" value="1" min="1" />
                        </div>
                    </div>

                    <div class="mt-4">
                        <label for="gambar" class="block text-sm font-medium text-gray-700 mb-1">URL Gambar</label>
                        <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                               id="gambar" placeholder="assets/images/services/laptop-service.jpg atau https://..." />
                        <p class="text-xs text-gray-400 mt-1">
                            Masukkan path gambar lokal (contoh: assets/images/services/laptop-service.jpg) atau URL eksternal.
                        </p>
                        <div id="gambarPreview" class="mt-2 hidden">
                            <img src="" alt="Preview" class="form-preview-img" />
                            <button type="button" id="removeImage" class="text-red-600 hover:text-red-800 text-sm ml-2 border-b border-red-600 hover:border-red-800 transition-colors">Hapus</button>
                        </div>
                    </div>

                    <div class="mt-4 flex items-center gap-3">
                        <input type="checkbox" class="w-4 h-4 text-brand focus:ring-brand border-gray-300 rounded" id="aktif" checked />
                        <label for="aktif" class="text-sm text-gray-700">Aktif</label>
                    </div>

                    <div class="flex flex-wrap gap-3 mt-6">
                        <button type="submit" class="bg-brand hover:bg-brand-light text-white font-medium px-6 py-2 rounded-lg transition-colors">Simpan</button>
                        <a href="services.html" class="border border-gray-300 hover:border-gray-400 text-gray-700 font-medium px-6 py-2 rounded-lg transition-colors">Batal</a>
                    </div>
                    <div id="formMessage" class="mt-3"></div>
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged, signOut, db, doc, getDoc, addDoc, updateDoc, collection } from '../assets/js/firebase.js';
        import { getImageUrl } from '../assets/js/utils.js';

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            else checkEditMode();
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });
        document.getElementById('mobileLogout').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });

        async function checkEditMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                document.getElementById('formTitle').textContent = 'Edit Layanan';
                document.getElementById('serviceId').value = id;
                await loadService(id);
            }
        }

        async function loadService(id) {
            try {
                const docSnap = await getDoc(doc(db, 'services', id));
                if (!docSnap.exists()) {
                    alert('Layanan tidak ditemukan');
                    window.location.href = 'services.html';
                    return;
                }
                const data = docSnap.data();
                
                document.getElementById('nama').value = data.nama || '';
                document.getElementById('kategori').value = data.kategori || '';
                document.getElementById('deskripsi').value = data.deskripsi || '';
                document.getElementById('deskripsiSingkat').value = data.deskripsiSingkat || '';
                document.getElementById('hargaMulai').value = data.hargaMulai || '';
                document.getElementById('order').value = data.order || 1;
                document.getElementById('gambar').value = data.gambar || '';
                document.getElementById('aktif').checked = data.aktif !== false;
                
                if (data.gambar) {
                    const preview = document.getElementById('gambarPreview');
                    const img = preview.querySelector('img');
                    img.src = getImageUrl(data.gambar);
                    preview.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error loading service:', error);
                alert('Gagal memuat layanan');
            }
        }

        document.getElementById('gambar').addEventListener('input', function() {
            const preview = document.getElementById('gambarPreview');
            const img = preview.querySelector('img');
            if (this.value.trim()) {
                img.src = getImageUrl(this.value.trim());
                preview.classList.remove('hidden');
            } else {
                preview.classList.add('hidden');
            }
        });

        document.getElementById('removeImage').addEventListener('click', function() {
            document.getElementById('gambar').value = '';
            document.getElementById('gambarPreview').classList.add('hidden');
        });

        document.getElementById('serviceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const id = document.getElementById('serviceId').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            const messageEl = document.getElementById('formMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Menyimpan...';
            messageEl.innerHTML = '';

            const data = {
                nama: document.getElementById('nama').value.trim(),
                kategori: document.getElementById('kategori').value,
                deskripsi: document.getElementById('deskripsi').value.trim(),
                deskripsiSingkat: document.getElementById('deskripsiSingkat').value.trim(),
                hargaMulai: document.getElementById('hargaMulai').value.trim(),
                order: parseInt(document.getElementById('order').value) || 1,
                gambar: document.getElementById('gambar').value.trim(),
                aktif: document.getElementById('aktif').checked
            };

            try {
                if (id) {
                    await updateDoc(doc(db, 'services', id), data);
                    messageEl.innerHTML = `<p class="text-green-600">Layanan berhasil diupdate!</p>`;
                } else {
                    data.createdAt = new Date().toISOString();
                    await addDoc(collection(db, 'services'), data);
                    messageEl.innerHTML = `<p class="text-green-600">Layanan berhasil ditambahkan!</p>`;
                    this.reset();
                    document.getElementById('gambarPreview').classList.add('hidden');
                }
            } catch (error) {
                console.error('Error saving service:', error);
                messageEl.innerHTML = `<p class="text-red-600">Gagal menyimpan: ${error.message}</p>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Simpan';
            }
        });
    </script>

</body>
</html>
