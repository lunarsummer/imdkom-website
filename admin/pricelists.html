<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricelist | Admin IMDKOM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

    <!-- ============================================================
    MOBILE HEADER
    ============================================================ -->
    <div class="admin-mobile-header">
        <button class="hamburger" id="menuToggle">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <span class="text-white font-bold">Pricelist</span>
        <div class="w-8"></div>
    </div>

    <!-- ============================================================
    OVERLAY
    ============================================================ -->
    <div class="admin-overlay" id="overlay"></div>

    <!-- ============================================================
    SIDEBAR
    ============================================================ -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="brand">IMDKOM Admin</div>
        <nav>
            <a href="dashboard.html" class="nav-link">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                Dashboard
            </a>
            <a href="landing-page.html" class="nav-link">
                <i data-lucide="home" class="w-4 h-4"></i>
                Landing Page
            </a>
            <a href="programs.html" class="nav-link">
                <i data-lucide="book-open" class="w-4 h-4"></i>
                Program Kursus
            </a>
            <a href="services.html" class="nav-link">
                <i data-lucide="wrench" class="w-4 h-4"></i>
                Computer Service
            </a>
            <a href="pricelists.html" class="nav-link active">
                <i data-lucide="tag" class="w-4 h-4"></i>
                Pricelist
            </a>
            <a href="documentations.html" class="nav-link">
                <i data-lucide="image" class="w-4 h-4"></i>
                Dokumentasi
            </a>
            <a href="testimonials.html" class="nav-link">
                <i data-lucide="message-square" class="w-4 h-4"></i>
                Testimoni
            </a>
            <a href="faq.html" class="nav-link">
                <i data-lucide="help-circle" class="w-4 h-4"></i>
                FAQ
            </a>
            <a href="consultations.html" class="nav-link">
                <i data-lucide="inbox" class="w-4 h-4"></i>
                Konsultasi
            </a>
            <a href="settings.html" class="nav-link">
                <i data-lucide="settings" class="w-4 h-4"></i>
                Pengaturan
            </a>
            <button id="logoutBtn" class="logout-btn">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                Logout
            </button>
        </nav>
    </aside>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <main class="admin-main">
        
        <!-- Page Header -->
        <div class="page-header">
            <h2>Pricelist</h2>
            <a href="pricelist-form.html" class="btn-primary">
                <i data-lucide="plus" class="w-4 h-4"></i>
                Tambah Pricelist
            </a>
        </div>

        <!-- Filter -->
        <div class="admin-card" style="margin-bottom: 1rem;">
            <label class="block text-sm font-medium text-gray-700 mb-2">Filter Layanan</label>
            <select id="filterService" class="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none text-sm">
                <option value="">Semua Layanan</option>
                <option value="laptop">Service Laptop</option>
                <option value="pc">Service PC</option>
                <option value="printer">Service Printer</option>
                <option value="panggil">Service Panggil</option>
                <option value="sparepart">Sparepart</option>
            </select>
        </div>

        <!-- Pricelist Accordion -->
        <div id="pricelistContainer">
            <div class="text-center text-gray-500 py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-brand border-t-transparent"></div>
                <p class="mt-3 text-sm">Memuat...</p>
            </div>
        </div>

    </main>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script type="module">
        import { auth, onAuthStateChanged, signOut, db, collection, getDocs, query, orderBy, where, deleteDoc, doc } from '../assets/js/firebase.js';

        // ============================================================
        // MOBILE SIDEBAR
        // ============================================================
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuToggle = document.getElementById('menuToggle');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        });

        // ============================================================
        // AUTH
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            else {
                loadPricelists();
                lucide.createIcons();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });

        // ============================================================
        // FILTER
        // ============================================================
        document.getElementById('filterService').addEventListener('change', loadPricelists);

        // ============================================================
        // LOAD PRICELISTS
        // ============================================================
        async function loadPricelists() {
            const container = document.getElementById('pricelistContainer');
            const serviceFilter = document.getElementById('filterService').value;
            
            try {
                let q = query(
                    collection(db, 'pricelists'),
                    where('aktif', '==', true),
                    orderBy('serviceSlug', 'asc'),
                    orderBy('kategori', 'asc'),
                    orderBy('order', 'asc')
                );
                
                if (serviceFilter) {
                    q = query(
                        collection(db, 'pricelists'),
                        where('serviceSlug', '==', serviceFilter),
                        orderBy('kategori', 'asc'),
                        orderBy('order', 'asc')
                    );
                }
                
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="admin-card text-center text-gray-500 py-12">
                            <i data-lucide="inbox" class="w-12 h-12 mx-auto text-gray-300 mb-3"></i>
                            <p>Belum ada pricelist.</p>
                            <a href="pricelist-form.html" class="btn-primary mt-4 inline-flex">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                                Tambah Pricelist
                            </a>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                // Group by service + kategori
                const grouped = {};
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const key = `${data.serviceSlug}__${data.kategori}`;
                    if (!grouped[key]) {
                        grouped[key] = {
                            serviceSlug: data.serviceSlug,
                            kategori: data.kategori,
                            items: []
                        };
                    }
                    grouped[key].items.push({ id: docSnap.id, ...data });
                });

                const serviceNames = {
                    laptop: 'Service Laptop',
                    pc: 'Service PC',
                    printer: 'Service Printer',
                    panggil: 'Service Panggil',
                    sparepart: 'Sparepart'
                };

                let html = '';
                let index = 0;
                Object.values(grouped).forEach((group) => {
                    const serviceName = serviceNames[group.serviceSlug] || group.serviceSlug;
                    const isOpen = index === 0 ? 'active' : '';
                    index++;
                    
                    html += `
                        <div class="pricelist-group">
                            <div class="pricelist-group-header ${isOpen}" data-target="group-${index}">
                                <div class="pricelist-group-title">
                                    <i data-lucide="tag" class="w-4 h-4 text-brand"></i>
                                    <span>${serviceName}</span>
                                    <span class="text-gray-400">•</span>
                                    <span class="text-gray-500 font-normal">${group.kategori}</span>
                                    <span class="pricelist-group-count">${group.items.length}</span>
                                </div>
                                <i data-lucide="chevron-down" class="pricelist-chevron w-5 h-5"></i>
                            </div>
                            <div class="pricelist-group-body ${isOpen}" id="group-${index}">
                                <div class="overflow-x-auto">
                                    <table class="admin-table">
                                        <thead>
                                            <tr>
                                                <th>Nama</th>
                                                <th>Harga</th>
                                                <th>Estimasi</th>
                                                <th>Status</th>
                                                <th>Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                    `;
                    
                    group.items.forEach((item) => {
                        const hasPromo = item.hargaPromo && item.hargaPromo < item.harga;
                        html += `
                            <tr>
                                <td data-label="Nama">
                                    <div class="font-medium text-gray-800">${item.nama || '-'}</div>
                                    ${item.deskripsi ? `<div class="text-xs text-gray-500">${item.deskripsi}</div>` : ''}
                                </td>
                                <td data-label="Harga">
                                    ${hasPromo ? `
                                        <span class="text-xs text-gray-400 line-through block">Rp ${(item.harga || 0).toLocaleString('id-ID')}</span>
                                        <span class="font-bold text-brand-dark">Rp ${(item.hargaPromo || 0).toLocaleString('id-ID')}</span>
                                    ` : `
                                        <span class="font-semibold text-brand">Rp ${(item.harga || 0).toLocaleString('id-ID')}</span>
                                    `}
                                </td>
                                <td data-label="Estimasi">
                                    <span class="text-gray-500 text-xs">${item.estimasi || '-'}</span>
                                </td>
                                <td data-label="Status">
                                    <span class="badge ${item.aktif ? 'badge-success' : 'badge-gray'}">
                                        ${item.aktif ? 'Aktif' : 'Nonaktif'}
                                    </span>
                                </td>
                                <td data-label="Aksi">
                                    <div class="flex gap-2">
                                        <a href="pricelist-form.html?id=${item.id}" class="text-brand hover:text-brand-light text-sm font-medium">
                                            Edit
                                        </a>
                                        <button class="delete-btn text-red-600 hover:text-red-800 text-sm font-medium" 
                                                data-id="${item.id}" 
                                                data-name="${item.nama || ''}">
                                            Hapus
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                    
                    html += `
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                lucide.createIcons();

                // ============================================================
                // ACCORDION TOGGLE
                // ============================================================
                document.querySelectorAll('.pricelist-group-header').forEach(header => {
                    header.addEventListener('click', () => {
                        const targetId = header.dataset.target;
                        const body = document.getElementById(targetId);
                        
                        header.classList.toggle('active');
                        body.classList.toggle('active');
                    });
                });

                // ============================================================
                // DELETE HANDLER
                // ============================================================
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const name = btn.dataset.name;
                        if (confirm(`Hapus pricelist "${name}"?`)) {
                            await deleteDoc(doc(db, 'pricelists', id));
                            loadPricelists();
                        }
                    });
                });

            } catch (error) {
                console.error('Error loading pricelists:', error);
                container.innerHTML = `
                    <div class="admin-card text-center text-red-600 py-12">
                        <p>Gagal memuat pricelist.</p>
                        <small class="text-gray-500">${error.message}</small>
                    </div>
                `;
            }
        }
    </script>

</body>
</html>
