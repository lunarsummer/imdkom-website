<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form FAQ | Admin IMDKOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#1a3c5e', light: '#2a5a7a', dark: '#0f2a42' },
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-brand min-h-screen hidden md:block">
            <div class="p-6 border-b border-brand-light">
                <span class="text-white font-bold text-xl">IMDKOM Admin</span>
            </div>
            <nav class="p-4 space-y-1">
                <a href="dashboard.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">Dashboard</a>
                <a href="landing-page.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">Landing Page</a>
                <a href="programs.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">Program Kursus</a>
                <a href="services.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">Computer Service</a>
                <a href="testimonials.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">Testimoni</a>
                <a href="faq.html" class="block px-4 py-2 text-white bg-brand-light rounded-lg">FAQ</a>
                <a href="settings.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg transition-colors">Pengaturan</a>
                <button id="logoutBtn" class="block w-full text-left px-4 py-2 text-gray-400 hover:text-white hover:bg-brand-light rounded-lg transition-colors mt-4">Logout</button>
            </nav>
        </aside>

        <!-- Mobile -->
        <div class="md:hidden w-full bg-brand p-4 flex justify-between items-center">
            <span class="text-white font-bold">IMDKOM Admin</span>
            <button id="mobileLogout" class="text-gray-300 hover:text-white text-sm">Logout</button>
        </div>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
                <h2 class="text-2xl md:text-3xl font-bold text-brand" id="formTitle">Tambah FAQ</h2>
                <a href="faq.html" class="text-gray-500 hover:text-gray-700 transition-colors">← Kembali</a>
            </div>

            <div class="bg-white border border-gray-200 rounded-lg p-6">
                <form id="faqForm">
                    <input type="hidden" id="faqId" />
                    
                    <div class="mt-4">
                        <label for="pertanyaan" class="block text-sm font-medium text-gray-700 mb-1">Pertanyaan *</label>
                        <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                               id="pertanyaan" required placeholder="Contoh: Berapa biaya kursus?" />
                    </div>

                    <div class="mt-4">
                        <label for="jawaban" class="block text-sm font-medium text-gray-700 mb-1">Jawaban *</label>
                        <textarea class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                                  id="jawaban" rows="4" required placeholder="Tulis jawaban di sini..."></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div>
                            <label for="order" class="block text-sm font-medium text-gray-700 mb-1">Urutan Tampil</label>
                            <input type="number" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                                   id="order" value="1" min="1" />
                        </div>
                    </div>

                    <div class="mt-4 flex items-center gap-3">
                        <input type="checkbox" class="w-4 h-4 text-brand focus:ring-brand border-gray-300 rounded" id="aktif" checked />
                        <label for="aktif" class="text-sm text-gray-700">Aktif</label>
                    </div>

                    <div class="flex flex-wrap gap-3 mt-6">
                        <button type="submit" class="bg-brand hover:bg-brand-light text-white font-medium px-6 py-2 rounded-lg transition-colors">Simpan</button>
                        <a href="faq.html" class="border border-gray-300 hover:border-gray-400 text-gray-700 font-medium px-6 py-2 rounded-lg transition-colors">Batal</a>
                    </div>
                    <div id="formMessage" class="mt-3"></div>
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged, signOut, db, doc, getDoc, addDoc, updateDoc, collection } from '../assets/js/firebase.js';

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            else checkEditMode();
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });
        document.getElementById('mobileLogout').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });

        async function checkEditMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                document.getElementById('formTitle').textContent = 'Edit FAQ';
                document.getElementById('faqId').value = id;
                await loadFaq(id);
            }
        }

        async function loadFaq(id) {
            try {
                const docSnap = await getDoc(doc(db, 'faqs', id));
                if (!docSnap.exists()) {
                    alert('FAQ tidak ditemukan');
                    window.location.href = 'faq.html';
                    return;
                }
                const data = docSnap.data();
                
                document.getElementById('pertanyaan').value = data.pertanyaan || '';
                document.getElementById('jawaban').value = data.jawaban || '';
                document.getElementById('order').value = data.order || 1;
                document.getElementById('aktif').checked = data.aktif !== false;
            } catch (error) {
                console.error('Error loading FAQ:', error);
                alert('Gagal memuat FAQ');
            }
        }

        document.getElementById('faqForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const id = document.getElementById('faqId').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            const messageEl = document.getElementById('formMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Menyimpan...';
            messageEl.innerHTML = '';

            const data = {
                pertanyaan: document.getElementById('pertanyaan').value.trim(),
                jawaban: document.getElementById('jawaban').value.trim(),
                order: parseInt(document.getElementById('order').value) || 1,
                aktif: document.getElementById('aktif').checked
            };

            if (!data.pertanyaan || !data.jawaban) {
                messageEl.innerHTML = `<p class="text-red-600">Pertanyaan dan jawaban wajib diisi!</p>`;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Simpan';
                return;
            }

            try {
                if (id) {
                    await updateDoc(doc(db, 'faqs', id), data);
                    messageEl.innerHTML = `<p class="text-green-600">FAQ berhasil diupdate!</p>`;
                } else {
                    data.createdAt = new Date().toISOString();
                    await addDoc(collection(db, 'faqs'), data);
                    messageEl.innerHTML = `<p class="text-green-600">FAQ berhasil ditambahkan!</p>`;
                    this.reset();
                }
            } catch (error) {
                console.error('Error saving FAQ:', error);
                messageEl.innerHTML = `<p class="text-red-600">Gagal menyimpan: ${error.message}</p>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Simpan';
            }
        });
    </script>

</body>
</html>
