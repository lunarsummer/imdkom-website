<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Admin IMDKOM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/admin.css">
    
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        .stats-card {
            background: white;
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .stats-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stats-number {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1a3c5e;
            line-height: 1;
        }
        .stats-label {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

    <!-- MOBILE HEADER -->
    <div class="admin-mobile-header">
        <button class="hamburger" id="menuToggle">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <span class="text-white font-bold">Dashboard</span>
        <div class="w-8"></div>
    </div>

    <!-- OVERLAY -->
    <div class="admin-overlay" id="overlay"></div>

    <!-- SIDEBAR -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="brand">IMDKOM Admin</div>
        <nav>
            <a href="dashboard.html" class="nav-link active"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Dashboard</a>
            <a href="landing-page.html" class="nav-link"><i data-lucide="home" class="w-4 h-4"></i>Landing Page</a>
            <a href="programs.html" class="nav-link"><i data-lucide="book-open" class="w-4 h-4"></i>Program Kursus</a>
            <a href="services.html" class="nav-link"><i data-lucide="wrench" class="w-4 h-4"></i>Computer Service</a>
            <a href="pricelists.html" class="nav-link"><i data-lucide="tag" class="w-4 h-4"></i>Pricelist</a>
            <a href="documentations.html" class="nav-link"><i data-lucide="image" class="w-4 h-4"></i>Dokumentasi</a>
            <a href="testimonials.html" class="nav-link"><i data-lucide="message-square" class="w-4 h-4"></i>Testimoni</a>
            <a href="faq.html" class="nav-link"><i data-lucide="help-circle" class="w-4 h-4"></i>FAQ</a>
            <a href="consultations.html" class="nav-link"><i data-lucide="inbox" class="w-4 h-4"></i>Konsultasi</a>
            <a href="settings.html" class="nav-link"><i data-lucide="settings" class="w-4 h-4"></i>Pengaturan</a>
            <button id="logoutBtn" class="logout-btn"><i data-lucide="log-out" class="w-4 h-4"></i>Logout</button>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
        <div class="page-header">
            <h2>Dashboard</h2>
            <span class="text-gray-500 text-sm" id="adminEmail">admin@imdkom.com</span>
        </div>

        <!-- Welcome -->
        <div class="admin-card mb-6" style="background: linear-gradient(135deg, #0573e0 0%, #d9ff00 100%); color: white; border: none;">
            <h3 class="text-lg font-bold mb-1">Selamat Datang! </h3>
            <p class="text-sm opacity-90">Kelola konten website IMDKOM dari dashboard ini.</p>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stats-card">
                <div class="stats-icon" style="background: rgba(26, 60, 94, 0.1); color: #1a3c5e;">
                    <i data-lucide="book-open" class="w-6 h-6"></i>
                </div>
                <div>
                    <div class="stats-number" id="totalPrograms">0</div>
                    <div class="stats-label">Program Aktif</div>
                </div>
            </div>
            
            <div class="stats-card">
                <div class="stats-icon" style="background: rgba(194, 65, 12, 0.1); color: #c2410c;">
                    <i data-lucide="wrench" class="w-6 h-6"></i>
                </div>
                <div>
                    <div class="stats-number" id="totalServices">0</div>
                    <div class="stats-label">Layanan Aktif</div>
                </div>
            </div>
            
            <div class="stats-card">
                <div class="stats-icon" style="background: rgba(5, 150, 105, 0.1); color: #059669;">
                    <i data-lucide="tag" class="w-6 h-6"></i>
                </div>
                <div>
                    <div class="stats-number" id="totalPricelists">0</div>
                    <div class="stats-label">Pricelist</div>
                </div>
            </div>
            
            <div class="stats-card">
                <div class="stats-icon" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b;">
                    <i data-lucide="inbox" class="w-6 h-6"></i>
                </div>
                <div>
                    <div class="stats-number" id="totalConsultations">0</div>
                    <div class="stats-label">Konsultasi</div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, onAuthStateChanged, signOut, db, collection, getDocs, query, where } from '../assets/js/firebase.js';

        // Mobile sidebar
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        document.getElementById('menuToggle').addEventListener('click', () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        });

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            else {
                document.getElementById('adminEmail').textContent = user.email;
                loadStats();
                lucide.createIcons();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });

        async function loadStats() {
            try {
                const progQuery = query(collection(db, 'programs'), where('aktif', '==', true));
                document.getElementById('totalPrograms').textContent = (await getDocs(progQuery)).size;

                const servQuery = query(collection(db, 'services'), where('aktif', '==', true));
                document.getElementById('totalServices').textContent = (await getDocs(servQuery)).size;

                document.getElementById('totalPricelists').textContent = (await getDocs(collection(db, 'pricelists'))).size;
                document.getElementById('totalConsultations').textContent = (await getDocs(collection(db, 'consultations'))).size;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
    </script>

</body>
</html>
