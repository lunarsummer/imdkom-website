<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Penilaian | Admin IMDKOM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/admin.css">
    
    <style>
        .nilai-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 96px; height: 96px; border-radius: 50%;
            font-size: 2rem; font-weight: 800;
        }
        .nilai-a { background: #d1fae5; color: #065f46; }
        .nilai-b { background: #dbeafe; color: #1e40af; }
        .nilai-c { background: #fef3c7; color: #92400e; }
        .nilai-d { background: #fee2e2; color: #991b1b; }

        .aspek-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.75rem 1rem; border-radius: 10px;
            background: #f8fafc; border: 1px solid #e2e8f0;
            margin-bottom: 0.5rem;
        }

        .aspek-nilai-badge {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 52px; height: 36px; padding: 0 0.75rem;
            border-radius: 8px; font-size: 1rem; font-weight: 800;
        }

        .nav-group { margin: 0; }
        .nav-group-toggle {
            display: flex; align-items: center; width: 100%;
            text-align: left; background: none; border: none;
            cursor: pointer; font: inherit; color: inherit;
        }
        .nav-group-toggle .nav-chevron { transition: transform 0.25s ease; opacity: 0.6; }
        .nav-group-toggle.open .nav-chevron { transform: rotate(180deg); opacity: 1; }
        .nav-group-toggle.open { background: rgba(255, 255, 255, 0.08); }
        .nav-submenu {
            display: flex; flex-direction: column; gap: 0.25rem;
            padding: 0.25rem 0 0.5rem 0; margin-left: 0.5rem;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
            animation: submenuSlide 0.25s ease;
        }
        .nav-submenu.hidden { display: none; }
        @keyframes submenuSlide {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .nav-submenu-link {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.5rem 0.75rem; font-size: 0.8rem;
            color: #d1d5db; text-decoration: none;
            border-radius: 0.375rem; transition: all 0.2s ease;
            margin-left: 0.25rem;
        }
        .nav-submenu-link:hover { background: rgba(255, 255, 255, 0.08); color: white; }
        .nav-submenu-link.active { background: rgba(255, 255, 255, 0.15); color: white; font-weight: 600; }
        .nav-submenu-link i { opacity: 0.7; flex-shrink: 0; }
        .nav-submenu-link.active i { opacity: 1; }
    </style>
</head>
<body>

    <!-- MOBILE HEADER -->
    <div class="admin-mobile-header">
        <button class="hamburger" id="menuToggle">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <span class="text-white font-bold">Detail Penilaian</span>
        <div class="w-8"></div>
    </div>

    <!-- OVERLAY -->
    <div class="admin-overlay" id="overlay"></div>

    <!-- SIDEBAR ADMIN (TANPA MENU PENILAIAN) -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="brand">IMDKOM Admin</div>
        <nav>
            <a href="dashboard.html" class="nav-link">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                Dashboard
            </a>
            <a href="landing-page.html" class="nav-link">
                <i data-lucide="home" class="w-4 h-4"></i>
                Landing Page
            </a>

            <div class="nav-group">
                <button type="button" class="nav-link nav-group-toggle w-full justify-between" data-target="submenu-program">
                    <span class="flex items-center gap-2">
                        <i data-lucide="book-open" class="w-4 h-4"></i>
                        Program Kursus
                    </span>
                    <i data-lucide="chevron-down" class="w-4 h-4 transition-transform nav-chevron"></i>
                </button>
                <div id="submenu-program" class="nav-submenu hidden">
                    <a href="programs.html" class="nav-submenu-link">
                        <i data-lucide="list" class="w-3.5 h-3.5"></i>
                        Daftar Program
                    </a>
                    <a href="program-submissions.html" class="nav-submenu-link">
                        <i data-lucide="file-check" class="w-3.5 h-3.5"></i>
                        Review Usulan
                    </a>
                    <a href="tentors.html" class="nav-submenu-link">
                        <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i>
                        Tentor
                    </a>
                </div>
            </div>

            <a href="services.html" class="nav-link">
                <i data-lucide="wrench" class="w-4 h-4"></i>
                Computer Service
            </a>
            <a href="pc-components.html" class="nav-link">
                <i data-lucide="cpu" class="w-4 h-4"></i>
                PC Components
            </a>
            <a href="pricelists.html" class="nav-link">
                <i data-lucide="tag" class="w-4 h-4"></i>
                Pricelist
            </a>
            <a href="documentations.html" class="nav-link">
                <i data-lucide="image" class="w-4 h-4"></i>
                Dokumentasi
            </a>
            <a href="testimonials.html" class="nav-link">
                <i data-lucide="message-square" class="w-4 h-4"></i>
                Testimoni
            </a>
            <a href="faq.html" class="nav-link">
                <i data-lucide="help-circle" class="w-4 h-4"></i>
                FAQ
            </a>
            <a href="consultations.html" class="nav-link">
                <i data-lucide="inbox" class="w-4 h-4"></i>
                Konsultasi
            </a>
            <a href="settings.html" class="nav-link">
                <i data-lucide="settings" class="w-4 h-4"></i>
                Pengaturan
            </a>
            <button id="logoutBtn" class="logout-btn">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                Logout
            </button>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
        
        <div class="page-header">
            <div>
                <h2>Detail Penilaian</h2>
                <p class="text-gray-500 text-sm mt-1">Penilaian peserta dari tentor</p>
            </div>
            <a href="tentors.html" class="text-gray-500 hover:text-gray-700 text-sm flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Kembali ke Tentor
            </a>
        </div>

        <div id="penilaianContainer">
            <div class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-brand border-t-transparent"></div>
                <p class="mt-3 text-sm text-gray-500">Memuat penilaian...</p>
            </div>
        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script type="module">
        import { 
            auth, signOut, 
            db, doc, getDoc 
        } from '../assets/js/firebase.js';
        import { protectPage } from '../assets/js/auth.js';

        // MOBILE SIDEBAR
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuToggle = document.getElementById('menuToggle');
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        });

        // AUTH
        protectPage({
            allowedRoles: ['admin'],
            requireActive: true,
            onAuthorized: async (profile) => {
                await loadPenilaian();
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = '../login.html';
        });

        // ============================================================
        // LOAD PENILAIAN — dari URL ?scheduleId=xxx
        // ============================================================
        async function loadPenilaian() {
            const container = document.getElementById('penilaianContainer');
            const urlParams = new URLSearchParams(window.location.search);
            const scheduleId = urlParams.get('scheduleId');

            // Tidak ada scheduleId → empty state
            if (!scheduleId) {
                container.innerHTML = `
                    <div class="admin-card text-center py-12 max-w-lg mx-auto">
                        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="award" class="w-8 h-8 text-gray-300"></i>
                        </div>
                        <p class="text-gray-500 font-medium">Pilih penilaian dari halaman Tentor</p>
                        <p class="text-sm text-gray-400 mt-1">
                            Buka <strong>Tentor</strong> → klik <strong>Detail</strong> pada tentor → 
                            klik <strong>Lihat Nilai</strong> di card jadwal peserta.
                        </p>
                        <a href="tentors.html" 
                           class="inline-flex items-center gap-2 mt-4 px-4 py-2 bg-brand hover:bg-brand-light text-white rounded-lg text-sm font-medium transition-colors">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i>
                            Ke Halaman Tentor
                        </a>
                    </div>
                `;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            try {
                const docSnap = await getDoc(doc(db, 'schedules', scheduleId));

                if (!docSnap.exists()) {
                    container.innerHTML = `
                        <div class="admin-card text-center py-12">
                            <i data-lucide="alert-circle" class="w-12 h-12 mx-auto text-red-300 mb-3"></i>
                            <p class="text-red-600 font-medium">Jadwal tidak ditemukan</p>
                            <p class="text-gray-500 text-xs mt-1">Data mungkin sudah dihapus.</p>
                            <a href="tentors.html" class="inline-block mt-4 text-brand hover:underline text-sm">← Kembali ke Tentor</a>
                        </div>
                    `;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    return;
                }

                const data = docSnap.data();
                const penilaian = data.penilaian;

                // Belum ada penilaian
                if (!penilaian || !Array.isArray(penilaian.aspek) || penilaian.aspek.length === 0) {
                    container.innerHTML = `
                        <div class="admin-card text-center py-12 max-w-lg mx-auto">
                            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i data-lucide="clock" class="w-8 h-8 text-gray-300"></i>
                            </div>
                            <p class="text-gray-500 font-medium">Belum dinilai</p>
                            <p class="text-sm text-gray-400 mt-1">
                                Peserta <strong>${escapeHtml(data.pesertaNama || '')}</strong> 
                                belum diberi penilaian oleh tentor.
                            </p>
                            <a href="tentors.html" class="inline-block mt-4 text-brand hover:underline text-sm">← Kembali ke Tentor</a>
                        </div>
                    `;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                    return;
                }

                // Render detail penilaian
                renderDetailPenilaian(data, penilaian);

            } catch (error) {
                console.error('Error loading penilaian:', error);
                container.innerHTML = `
                    <div class="admin-card text-center py-12">
                        <i data-lucide="alert-circle" class="w-12 h-12 mx-auto text-red-300 mb-3"></i>
                        <p class="text-red-600 font-medium">Gagal memuat penilaian</p>
                        <p class="text-gray-500 text-xs mt-1">${error.message}</p>
                        <a href="tentors.html" class="inline-block mt-4 text-brand hover:underline text-sm">← Kembali ke Tentor</a>
                    </div>
                `;
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }

        // ============================================================
        // RENDER DETAIL PENILAIAN
        // ============================================================
        function renderDetailPenilaian(data, penilaian) {
            const container = document.getElementById('penilaianContainer');
            const rataRata = penilaian.rataRata || 0;
            const nilaiClass = getNilaiClass(rataRata);
            const aspek = penilaian.aspek || [];

            const tanggal = penilaian.tanggal
                ? new Date(penilaian.tanggal).toLocaleString('id-ID', {
                    day: 'numeric', month: 'long', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                })
                : '-';

            const sesiSelesai = (data.sesi || []).filter(s => s.status === 'selesai').length;
            const totalAktif = (data.sesi || []).filter(s => s.status !== 'off').length;

            // Rincian aspek
            let aspekHtml = '';
            aspek.forEach((a, i) => {
                const aClass = getNilaiClass(a.nilai);
                aspekHtml += `
                    <div class="aspek-row">
                        <div class="flex-1 min-w-0 pr-3">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-mono text-gray-400">${i+1}.</span>
                                <p class="font-semibold text-gray-800 text-sm">${escapeHtml(a.nama)}</p>
                            </div>
                            ${a.catatan ? `<p class="text-xs text-gray-500 mt-1 ml-6">${escapeHtml(a.catatan)}</p>` : ''}
                        </div>
                        <span class="aspek-nilai-badge ${aClass}">${a.nilai}</span>
                    </div>
                `;
            });

            container.innerHTML = `
                <!-- HEADER: Peserta & Nilai -->
                <div class="admin-card text-center mb-4">
                    <div class="nilai-badge ${nilaiClass} mx-auto">${rataRata}</div>
                    <p class="text-xs text-gray-500 uppercase tracking-wide mt-3">Rata-rata Nilai</p>
                    <h3 class="font-bold text-gray-800 text-2xl mt-1">${escapeHtml(data.pesertaNama || 'Peserta')}</h3>
                    <p class="text-sm text-gray-500">${escapeHtml(data.programNama || '')}</p>
                    <div class="inline-flex items-center gap-2 mt-3 px-3 py-1 bg-gray-100 rounded-full">
                        <i data-lucide="user" class="w-3 h-3 text-gray-500"></i>
                        <span class="text-xs font-medium text-gray-600">Tentor: ${escapeHtml(data.tentorNama || '-')}</span>
                    </div>
                </div>

                <!-- INFO GRID -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
                    <div class="admin-card text-center">
                        <p class="text-xs text-gray-500">Kelas</p>
                        <p class="font-bold text-gray-800 mt-1">${escapeHtml(data.kelas || '-')}</p>
                    </div>
                    <div class="admin-card text-center">
                        <p class="text-xs text-gray-500">Ruang</p>
                        <p class="font-bold text-gray-800 mt-1">${escapeHtml(data.ruang || '-')}</p>
                    </div>
                    <div class="admin-card text-center">
                        <p class="text-xs text-gray-500">Pertemuan</p>
                        <p class="font-bold text-gray-800 mt-1">${sesiSelesai} / ${totalAktif}</p>
                    </div>
                    <div class="admin-card text-center">
                        <p class="text-xs text-gray-500">Aspek Dinilai</p>
                        <p class="font-bold text-gray-800 mt-1">${aspek.length}</p>
                    </div>
                </div>

                <!-- RINCIAN ASPEK -->
                <div class="admin-card mb-4">
                    <h4 class="font-bold text-gray-800 mb-3 flex items-center gap-2">
                        <i data-lucide="list-checks" class="w-4 h-4 text-brand"></i>
                        Rincian Aspek Penilaian
                    </h4>
                    ${aspekHtml}
                </div>

                <!-- CATATAN UMUM -->
                ${penilaian.catatanUmum ? `
                    <div class="admin-card mb-4">
                        <h4 class="font-bold text-gray-800 mb-2 flex items-center gap-2">
                            <i data-lucide="message-square" class="w-4 h-4 text-brand"></i>
                            Catatan Umum
                        </h4>
                        <p class="text-sm text-gray-700 bg-blue-50 border border-blue-200 p-3 rounded-lg leading-relaxed">${escapeHtml(penilaian.catatanUmum)}</p>
                    </div>
                ` : ''}

                <!-- TANGGAL -->
                <div class="admin-card">
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-500">Dinilai pada</span>
                        <span class="font-medium text-gray-700">${tanggal}</span>
                    </div>
                </div>
            `;
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        // ============================================================
        // HELPER: Nilai badge class
        // ============================================================
        function getNilaiClass(nilai) {
            if (nilai >= 85) return 'nilai-a';
            if (nilai >= 70) return 'nilai-b';
            if (nilai >= 60) return 'nilai-c';
            return 'nilai-d';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // NAV SUBMENU
        document.querySelectorAll('.nav-group-toggle').forEach(toggle => {
            toggle.addEventListener('click', () => {
                const targetId = toggle.dataset.target;
                const submenu = document.getElementById(targetId);
                if (!submenu) return;
                const isOpen = !submenu.classList.contains('hidden');
                if (isOpen) {
                    submenu.classList.add('hidden');
                    toggle.classList.remove('open');
                } else {
                    submenu.classList.remove('hidden');
                    toggle.classList.add('open');
                }
                if (typeof lucide !== 'undefined') lucide.createIcons();
            });
        });
        document.querySelectorAll('.nav-submenu-link.active').forEach(activeLink => {
            const submenu = activeLink.closest('.nav-submenu');
            if (submenu) {
                submenu.classList.remove('hidden');
                const toggle = document.querySelector(`.nav-group-toggle[data-target="${submenu.id}"]`);
                if (toggle) toggle.classList.add('open');
            }
        });
    </script>

</body>
</html>
