<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pricelist | Admin IMDKOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#1a3c5e', light: '#2a5a7a', dark: '#c2410c' },
                        success: { DEFAULT: '#059669', light: '#10b981', dark: '#047857' },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">

    <div class="flex min-h-screen">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-brand min-h-screen hidden md:block">
            <div class="p-6 border-b border-brand-light">
                <span class="text-white font-bold text-xl">IMDKOM Admin</span>
            </div>
            <nav class="p-4 space-y-1">
                <a href="dashboard.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg">Dashboard</a>
                <a href="landing-page.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg">Landing Page</a>
                <a href="programs.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg">Program Kursus</a>
                <a href="services.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg">Computer Service</a>
                <a href="pricelists.html" class="block px-4 py-2 text-white bg-brand-light rounded-lg">Pricelist</a>
                <a href="documentations.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg">Dokumentasi</a>
                <a href="testimonials.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg">Testimoni</a>
                <a href="faq.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg">FAQ</a>
                <a href="consultations.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg">Konsultasi</a>
                <a href="settings.html" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-brand-light rounded-lg">Pengaturan</a>
                <button id="logoutBtn" class="block w-full text-left px-4 py-2 text-gray-400 hover:text-white hover:bg-brand-light rounded-lg mt-4">Logout</button>
            </nav>
        </aside>

        <!-- MAIN -->
        <main class="flex-1 p-6">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
                <h2 class="text-2xl md:text-3xl font-bold text-brand" id="formTitle">Tambah Pricelist</h2>
                <a href="pricelists.html" class="text-gray-500 hover:text-gray-700">← Kembali</a>
            </div>

            <div class="bg-white border border-gray-200 rounded-lg p-6 max-w-3xl">
                <form id="pricelistForm">
                    <input type="hidden" id="pricelistId" />
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Layanan *</label>
                            <select id="serviceSlug" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none">
                                <option value="">Pilih layanan</option>
                                <option value="laptop">Service Laptop</option>
                                <option value="pc">Service PC</option>
                                <option value="printer">Service Printer</option>
                                <option value="panggil">Service Panggil</option>
                                <option value="sparepart">Sparepart</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Kategori *</label>
                            <input type="text" id="kategori" required
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none"
                                   placeholder="Contoh: Perbaikan Hardware, Software" />
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Item *</label>
                        <input type="text" id="nama" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none"
                               placeholder="Contoh: Ganti LCD Laptop" />
                    </div>

                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
                        <textarea id="deskripsi" rows="2"
                                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none"
                                  placeholder="Keterangan singkat"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Harga * (Angka)</label>
                            <input type="number" id="harga" required
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none"
                                   placeholder="500000" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Harga Promo (Opsional)</label>
                            <input type="number" id="hargaPromo"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none"
                                   placeholder="450000" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Estimasi</label>
                            <input type="text" id="estimasi"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none"
                                   placeholder="1 hari / 2 jam" />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Garansi</label>
                            <input type="text" id="garansi"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none"
                                   placeholder="2 bulan / 1 tahun / -" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Urutan Tampil</label>
                            <input type="number" id="order" value="1" min="1"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" />
                        </div>
                    </div>

                    <div class="mt-4 flex items-center gap-3">
                        <input type="checkbox" id="aktif" checked class="w-4 h-4 text-brand focus:ring-brand border-gray-300 rounded" />
                        <label for="aktif" class="text-sm text-gray-700">Aktif</label>
                    </div>

                    <div class="flex flex-wrap gap-3 mt-6 pt-4 border-t border-gray-200">
                        <button type="submit" class="bg-brand hover:bg-brand-light text-white font-medium px-6 py-2 rounded-lg">Simpan</button>
                        <a href="pricelists.html" class="border border-gray-300 hover:border-gray-400 text-gray-700 font-medium px-6 py-2 rounded-lg">Batal</a>
                    </div>

                    <div id="formMessage" class="mt-3"></div>
                </form>
            </div>
        </main>
    </div>

    <!-- JAVASCRIPT -->
    <script type="module">
        import { auth, onAuthStateChanged, signOut, db, doc, getDoc, addDoc, updateDoc, collection } from '../assets/js/firebase.js';

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            else checkEditMode();
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });

        async function checkEditMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                document.getElementById('formTitle').textContent = 'Edit Pricelist';
                document.getElementById('pricelistId').value = id;
                await loadPricelist(id);
            }
        }

        async function loadPricelist(id) {
            try {
                const docSnap = await getDoc(doc(db, 'pricelists', id));
                if (!docSnap.exists()) {
                    alert('Pricelist tidak ditemukan');
                    window.location.href = 'pricelists.html';
                    return;
                }
                const data = docSnap.data();
                
                document.getElementById('serviceSlug').value = data.serviceSlug || '';
                document.getElementById('kategori').value = data.kategori || '';
                document.getElementById('nama').value = data.nama || '';
                document.getElementById('deskripsi').value = data.deskripsi || '';
                document.getElementById('harga').value = data.harga || '';
                document.getElementById('hargaPromo').value = data.hargaPromo || '';
                document.getElementById('estimasi').value = data.estimasi || '';
                document.getElementById('garansi').value = data.garansi || '';
                document.getElementById('order').value = data.order || 1;
                document.getElementById('aktif').checked = data.aktif !== false;
            } catch (error) {
                console.error('Error loading pricelist:', error);
                alert('Gagal memuat pricelist');
            }
        }

        document.getElementById('pricelistForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const id = document.getElementById('pricelistId').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            const messageEl = document.getElementById('formMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Menyimpan...';
            messageEl.innerHTML = '';

            const data = {
                serviceSlug: document.getElementById('serviceSlug').value,
                kategori: document.getElementById('kategori').value.trim(),
                nama: document.getElementById('nama').value.trim(),
                deskripsi: document.getElementById('deskripsi').value.trim(),
                harga: parseInt(document.getElementById('harga').value) || 0,
                hargaPromo: parseInt(document.getElementById('hargaPromo').value) || null,
                estimasi: document.getElementById('estimasi').value.trim(),
                garansi: document.getElementById('garansi').value.trim(),
                order: parseInt(document.getElementById('order').value) || 1,
                aktif: document.getElementById('aktif').checked,
                updatedAt: new Date().toISOString()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, 'pricelists', id), data);
                    messageEl.innerHTML = `<p class="text-green-600">✅ Pricelist berhasil diupdate!</p>`;
                } else {
                    data.createdAt = new Date().toISOString();
                    await addDoc(collection(db, 'pricelists'), data);
                    messageEl.innerHTML = `<p class="text-green-600">✅ Pricelist berhasil ditambahkan!</p>`;
                    this.reset();
                }
                
                setTimeout(() => {
                    window.location.href = 'pricelists.html';
                }, 1500);
            } catch (error) {
                console.error('Error saving pricelist:', error);
                messageEl.innerHTML = `<p class="text-red-600">❌ Gagal: ${error.message}</p>`;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Simpan';
            }
        });
    </script>

</body>
</html>
