<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin | IMDKOM</title>
    
    <!-- Hapus Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#1a3c5e', light: '#2a5a7a', dark: '#0f2a42' },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

    <div class="bg-white border border-gray-200 rounded-lg p-8 max-w-md w-full">
        <h1 class="text-2xl font-bold text-brand">IMDKOM</h1>
        <p class="text-gray-500 text-sm mb-6">Login Admin</p>
        
        <!-- Loading indicator -->
        <div id="loadingIndicator" class="hidden text-center py-4">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-brand border-t-transparent"></div>
            <p class="text-sm text-gray-500 mt-2">Menyiapkan database...</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                       id="email" placeholder="admin@imdkom.com" required />
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none" 
                       id="password" placeholder="Password" required />
            </div>
            <button type="submit" class="w-full bg-brand hover:bg-brand-light text-white font-medium py-2 px-4 rounded-lg transition-colors">
                Login
            </button>
            <div id="loginError" class="text-red-600 text-sm mt-3 hidden">Email atau password salah.</div>
            <div id="loginInfo" class="text-blue-600 text-sm mt-3 hidden"></div>
        </form>
        
        <a href="../index.html" class="block text-center text-gray-400 text-sm mt-4 hover:text-gray-600 transition-colors">
            ← Kembali ke Beranda
        </a>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from '../assets/js/firebase.js';
        import { initDatabase } from '../assets/js/init-db.js';

        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');
        const infoEl = document.getElementById('loginInfo');
        const loadingEl = document.getElementById('loadingIndicator');

        // Cek apakah sudah login
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Sudah login, langsung ke dashboard
                window.location.href = 'dashboard.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');
            infoEl.classList.add('hidden');
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = form.querySelector('button[type="submit"]');

            try {
                // Disable button
                submitBtn.disabled = true;
                submitBtn.textContent = 'Login...';
                
                // Login ke Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log('✅ Login berhasil:', userCredential.user.email);
                
                // Tampilkan loading
                loadingEl.classList.remove('hidden');
                infoEl.textContent = 'Menyiapkan database...';
                infoEl.classList.remove('hidden');
                
                // Inisialisasi database (buat data default jika belum ada)
                const result = await initDatabase();
                
                if (result.success) {
                    infoEl.textContent = '✅ Database siap! Mengarahkan ke dashboard...';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    infoEl.textContent = '⚠️ Database siap sebagian. Tetap lanjut ke dashboard.';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }
                
            } catch (error) {
                console.error('Login error:', error);
                loadingEl.classList.add('hidden');
                
                if (error.code === 'auth/user-not-found') {
                    errorEl.textContent = 'Email tidak terdaftar. Silakan buat akun di Firebase Console.';
                } else if (error.code === 'auth/wrong-password') {
                    errorEl.textContent = 'Password salah. Coba lagi.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorEl.textContent = 'Terlalu banyak percobaan. Tunggu beberapa menit.';
                } else {
                    errorEl.textContent = error.message || 'Login gagal. Coba lagi.';
                }
                errorEl.classList.remove('hidden');
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
    </script>

</body>
</html>
