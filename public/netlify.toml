# ============================================================
# NETLIFY CONFIGURATION
# IMDKOM Yogyakarta
# ============================================================

[build]
  base = "public"
  publish = "."

# ============================================================
# FUNCTIONS (serverless Node) — dipanggil dari register.html
#   POST /.netlify/functions/midtrans-snap
#   GET  /.netlify/functions/midtrans-qris-status?orderId=... (Snap order_id)
# Set env MIDTRANS_SERVER_KEY & MIDTRANS_ENV=sandbox|production
# ============================================================
[functions]
  directory = "netlify/functions"

# ============================================================
# EDGE FUNCTIONS
# ============================================================
[[edge_functions]]
  path = "/karir.html"
  function = "lowongan"

[[edge_functions]]
  path = "/karir"
  function = "lowongan"

[[edge_functions]]
  path = "/program-detail.html"
  function = "program-detail"

[[edge_functions]]
  path = "/program-detail"
  function = "program-detail"

[[edge_functions]]
  path = "/service-detail.html"
  function = "service-detail"

[[edge_functions]]
  path = "/service-detail"
  function = "service-detail"
